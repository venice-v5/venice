name: build

on: [push]

jobs:
  build_wheel:
    name: build-wheel
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: checkout micropython
        run: git submodule update --init --depth 1 packages/venice/micropython

      - name: setup-uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "0.7.3"

      - name: setup-rust-toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-30
          components: rust-src

      - name: setup-rust-cache
        uses: Swatinem/rust-cache@v2

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - name: run headergen
        run: python3 headergen.py

      - name: install-cargo-v5
        run: cargo install --git https://github.com/aadishv/cargo-v5 --branch toolchain --locked cargo-v5

      - name: build-rust
        run: cd packages/venice && cargo v5 toolchain install -y && cargo v5 build

      - name: gzip-bin
        run: gzip -c target/armv7a-vex-v5/debug/venice.bin > venice/venice.bin

      - name: build-wheel
        run: cd venice && uv sync && uv build

      - name: upload-bin
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: venice/venice.bin

      - name: upload-wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: venice/dist
